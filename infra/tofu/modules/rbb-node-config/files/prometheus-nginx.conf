# NGINX na frente do Prometheus, conforme rbb-monitoracao / roteiro_prometheus_nginx.md:
#  - 443:  interface web do Prometheus (TLS + usuário/senha em .htpasswd)
#  - 8443: /federate com autenticação mútua (mTLS) — certificados dos demais partícipes em certs/client.pem
events {}

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  upstream prometheus {
    server prometheus:9090;
  }

  server {
    listen 443 ssl;
    server_name _;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/certificado.pem;
    ssl_certificate_key /etc/nginx/certs/chave-privada.key;

    location / {
      auth_basic           "Prometheus RBB";
      auth_basic_user_file /etc/nginx/.htpasswd;
      proxy_pass http://prometheus/;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }
  }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/nginx/certs/certificado.pem;
    ssl_certificate_key /etc/nginx/certs/chave-privada.key;

    # Certificados autoassinados (concatenados) das organizações autorizadas a coletar métricas.
    ssl_client_certificate /etc/nginx/certs/client.pem;
    ssl_verify_client      on;
    ssl_verify_depth       0;

    location /federate {
      proxy_pass http://prometheus/federate;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
    }
  }
}
