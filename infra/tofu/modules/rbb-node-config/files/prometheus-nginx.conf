# NGINX na frente do Prometheus:
#  - /federate: autenticação mútua (mTLS) com os certificados dos demais partícipes (certs/client.pem)
#  - demais rotas (UI): usuário/senha (.htpasswd) + TLS
events {}

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  upstream prometheus {
    server prometheus:9090;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/certificado.pem;
    ssl_certificate_key /etc/nginx/certs/chave-privada.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Certificados (concatenados) das organizações autorizadas a coletar métricas.
    ssl_client_certificate /etc/nginx/certs/client.pem;
    ssl_verify_client      optional_no_ca;
    ssl_verify_depth       2;

    location /federate {
      if ($ssl_client_verify != SUCCESS) {
        return 403;
      }
      proxy_pass http://prometheus;
      proxy_set_header Host $host;
    }

    location / {
      auth_basic           "Prometheus RBB";
      auth_basic_user_file /etc/nginx/.htpasswd;
      proxy_pass http://prometheus;
      proxy_set_header Host $host;
    }
  }
}
